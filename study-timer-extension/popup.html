<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Timer & CareerPrep AI</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Tab Styling */
    .tab-bar { display: flex; border-b: 1px solid #383838; margin-bottom: 12px; }
    .tab-btn { flex: 1; padding: 8px; font-size: 12px; font-weight: 600; background: transparent; color: #a1a1aa; border: none; cursor: pointer; border-bottom: 2px solid transparent; }
    .tab-btn.active { color: #10a37f; border-bottom-color: #10a37f; }
    
    /* Extension Chat CSS */
    .chat-tab { display: flex; flex-direction: column; height: 320px; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 6px; space-y: 8px; }
    .chat-msg { margin-bottom: 8px; font-size: 12px; line-height: 1.4; border-radius: 8px; padding: 8px 10px; }
    .chat-msg.user { background: #3b82f6; color: #fff; margin-left: 20px; text-align: right; }
    .chat-msg.bot { background: #27272a; color: #e4e4e7; margin-right: 20px; border: 1px solid #3f3f46; }
    .chat-input-row { display: flex; gap: 6px; padding-top: 8px; }
    .chat-input { flex: 1; bg: #18181b; border: 1px solid #3f3f46; color: #fff; padding: 6px 10px; border-radius: 6px; font-size: 12px; outline: none; }
    .chat-send-btn { bg: #10a37f; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 12px; }
  </style>
</head>
<body>
  <div class="extension-card">
    
    <!-- Tab Navigation Header -->
    <div class="tab-bar">
      <button id="timerTabBtn" class="tab-btn active" onclick="switchTab('timer')">⏱️ Pomodoro Timer</button>
      <button id="chatTabBtn" class="tab-btn" onclick="switchTab('chat')">🤖 CareerPrep AI</button>
    </div>

    <!-- TAB 1: POMODORO TIMER -->
    <div id="timerTabContent">
      <header class="header">
        <div class="brand">
          <h1 class="app-title">Study Timer</h1>
          <span class="sub-title">Pomodoro Productivity</span>
        </div>
        <div id="modeBadge" class="badge mode-study">Study Session</div>
      </header>

      <main class="timer-section">
        <div class="timer-display" id="timerDisplay">25:00</div>

        <div class="session-counter">
          <svg class="counter-icon" viewBox="0 0 24 24" width="16" height="16">
            <path fill="currentColor" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
          </svg>
          <span>Sessions Completed: <strong id="sessionCount">0</strong></span>
        </div>

        <div class="controls">
          <button id="startBtn" class="btn btn-start" title="Start Timer">Start</button>
          <button id="pauseBtn" class="btn btn-pause" disabled title="Pause Timer">Pause</button>
          <button id="resetBtn" class="btn btn-reset" title="Reset Session">Reset</button>
        </div>
      </main>

      <section class="settings-section">
        <h2 class="settings-heading">Timer Configurations (Minutes)</h2>
        <div class="settings-grid">
          <div class="form-group">
            <label for="studyInput">Study Duration</label>
            <input type="number" id="studyInput" min="1" max="120" value="25">
          </div>
          <div class="form-group">
            <label for="breakInput">Break Duration</label>
            <input type="number" id="breakInput" min="1" max="60" value="5">
          </div>
        </div>
        <div class="settings-footer">
          <button id="saveSettingsBtn" class="btn btn-save">Save Settings</button>
          <button id="resetCountBtn" class="btn btn-clear-count">Reset Count</button>
        </div>
        <div id="statusMsg" class="status-msg hidden"></div>
      </section>
    </div>

    <!-- TAB 2: CAREERPREP AI CHATBOT EXTENSION -->
    <div id="chatTabContent" class="chat-tab" style="display: none;">
      <div id="extChatMessages" class="chat-messages">
        <div class="chat-msg bot">
          <strong>CareerPrep AI 👋</strong><br>
          Ask me any placement, DSA, aptitude, or interview task right inside your browser extension!
        </div>
      </div>
      <div class="chat-input-row">
        <input type="text" id="extChatInput" class="chat-input" placeholder="Type prompt or task..." onkeydown="if(event.key==='Enter') sendExtMessage()">
        <button onclick="sendExtMessage()" class="chat-send-btn">Send</button>
      </div>
    </div>

    <footer class="footer">
      <p>Offline Pomodoro Productivity & Career Prep Extension</p>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
