<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="extension-card">
    <!-- Header with Title and Mode Badge -->
    <header class="header">
      <div class="brand">
        <h1 class="app-title">Study Timer</h1>
        <span class="sub-title">Pomodoro Productivity</span>
      </div>
      <div id="modeBadge" class="badge mode-study">Study Session</div>
    </header>

    <!-- Main Clock & Controls Card -->
    <main class="timer-section">
      <div class="timer-display" id="timerDisplay">25:00</div>

      <!-- Completed Sessions Counter -->
      <div class="session-counter">
        <svg class="counter-icon" viewBox="0 0 24 24" width="16" height="16">
          <path fill="currentColor" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
        </svg>
        <span>Sessions Completed: <strong id="sessionCount">0</strong></span>
      </div>

      <!-- Control Action Buttons -->
      <div class="controls">
        <button id="startBtn" class="btn btn-start" title="Start Timer">
          <svg class="btn-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
          Start
        </button>
        <button id="pauseBtn" class="btn btn-pause" disabled title="Pause Timer">
          <svg class="btn-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          Pause
        </button>
        <button id="resetBtn" class="btn btn-reset" title="Reset Session">
          <svg class="btn-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
          Reset
        </button>
      </div>
    </main>

    <!-- Settings Card -->
    <section class="settings-section">
      <h2 class="settings-heading">Timer Configurations (Minutes)</h2>
      <div class="settings-grid">
        <div class="form-group">
          <label for="studyInput">Study Duration</label>
          <input type="number" id="studyInput" min="1" max="120" value="25" placeholder="1-120">
        </div>
        <div class="form-group">
          <label for="breakInput">Break Duration</label>
          <input type="number" id="breakInput" min="1" max="60" value="5" placeholder="1-60">
        </div>
      </div>

      <div class="settings-footer">
        <button id="saveSettingsBtn" class="btn btn-save">Save Settings</button>
        <button id="resetCountBtn" class="btn btn-clear-count" title="Reset completed sessions count">Reset Count</button>
      </div>

      <!-- Feedback / Error Message Bar -->
      <div id="statusMsg" class="status-msg hidden"></div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <p>Offline Pomodoro Productivity Assistant for Students</p>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
