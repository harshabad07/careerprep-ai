<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerPrep AI — Placement & Interview Chatbot</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .chat-box { height: calc(100vh - 160px); }
        .message-anim { animation: fadeIn 0.2s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen flex flex-col justify-between">

    <!-- Simple Top Bar -->
    <header class="bg-indigo-600 text-white px-4 py-3 flex items-center justify-between shadow-md">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center text-lg">
                🎓
            </div>
            <div>
                <h1 class="font-bold text-base leading-tight">CareerPrep AI</h1>
                <p class="text-xs text-indigo-200">Placement & Interview Assistant</p>
            </div>
        </div>
        <button onclick="clearChat()" class="text-xs bg-indigo-700 hover:bg-indigo-800 px-3 py-1.5 rounded-lg text-indigo-100 transition">
            <i class="fa-solid fa-rotate-right mr-1"></i> Reset Chat
        </button>
    </header>

    <!-- Chat Messages Container -->
    <main id="chatMessages" class="chat-box flex-1 overflow-y-auto p-4 space-y-3 max-w-3xl w-full mx-auto">
        <!-- Welcome Message -->
        <div class="message-anim flex items-start gap-2.5">
            <div class="w-8 h-8 rounded-full bg-indigo-600 text-white flex items-center justify-center text-xs font-bold shrink-0">
                AI
            </div>
            <div class="bg-white border border-slate-200 rounded-2xl rounded-tl-none p-3.5 text-sm shadow-sm max-w-[85%] space-y-2">
                <p class="font-semibold text-indigo-950">Hello! I am CareerPrep AI 👋</p>
                <p class="text-slate-600 leading-relaxed">I'm here to help you ace your campus placements and job interviews. How can I assist you today?</p>
                <div class="pt-1 flex flex-wrap gap-1.5 text-xs">
                    <button onclick="quickSend('Start Technical Mock Interview')" class="bg-indigo-50 text-indigo-700 border border-indigo-200 px-2.5 py-1 rounded-full hover:bg-indigo-100">🎯 Tech Mock Interview</button>
                    <button onclick="quickSend('Start HR Mock Interview')" class="bg-emerald-50 text-emerald-700 border border-emerald-200 px-2.5 py-1 rounded-full hover:bg-emerald-100">👔 HR Mock Interview</button>
                    <button onclick="quickSend('DSA Question with explanation')" class="bg-amber-50 text-amber-700 border border-amber-200 px-2.5 py-1 rounded-full hover:bg-amber-100">💻 Practice DSA</button>
                    <button onclick="quickSend('Quantitative Aptitude Practice')" class="bg-cyan-50 text-cyan-700 border border-cyan-200 px-2.5 py-1 rounded-full hover:bg-cyan-100">📊 Aptitude Test</button>
                    <button onclick="quickSend('Resume tips for freshers')" class="bg-rose-50 text-rose-700 border border-rose-200 px-2.5 py-1 rounded-full hover:bg-rose-100">📄 Resume Tips</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Typing Indicator -->
    <div id="typing" class="hidden max-w-3xl w-full mx-auto px-4 py-1 flex items-center space-x-2 text-slate-400 text-xs">
        <span class="italic">CareerPrep AI is typing...</span>
    </div>

    <!-- Simple Input Form -->
    <footer class="bg-white border-t border-slate-200 p-3">
        <form id="chatForm" onsubmit="handleSend(event)" class="max-w-3xl mx-auto flex items-center gap-2">
            <input 
                type="text" 
                id="userInput" 
                placeholder="Ask a placement question or type 'Mock Interview'..." 
                class="flex-1 bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-600 focus:bg-white transition"
                autocomplete="off"
            />
            <button 
                type="submit" 
                class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2.5 rounded-xl text-sm transition flex items-center gap-1.5 shrink-0"
            >
                <span>Send</span>
                <i class="fa-solid fa-paper-plane text-xs"></i>
            </button>
        </form>
    </footer>

    <!-- Simple Application Logic -->
    <script>
        let inMockInterview = false;
        let interviewStep = 0;
        let interviewType = 'tech'; // 'tech' or 'hr'

        const techQuestions = [
            {
                q: "Question 1: What is the difference between a Process and a Thread in Operating Systems?",
                hint: "Think about memory isolation vs shared memory space.",
                answer: "Process is an independent program in execution with isolated memory. A Thread is a subset of a process sharing the same memory space."
            },
            {
                q: "Question 2: What is Method Overloading vs Method Overriding in Object-Oriented Programming?",
                hint: "Consider compile-time vs runtime polymorphism.",
                answer: "Overloading happens in the same class with different parameters (compile-time). Overriding redefines a base class method in a derived class with the exact same signature (runtime)."
            },
            {
                q: "Question 3: How does a Hash Table achieve O(1) time complexity for lookup?",
                hint: "Explain hashing functions and key indexing.",
                answer: "A Hash Table uses a hash function to map keys directly to array indices for O(1) average lookup. Collisions are handled via chaining or open addressing."
            }
        ];

        const hrQuestions = [
            {
                q: "Question 1: Tell me about yourself and why you chose your branch of study.",
                hint: "Use the Present-Past-Future format: Degree, key project, and why this role.",
                answer: "Start with your current degree and branch, mention 1-2 practical projects or achievements, and conclude with your career motivation."
            },
            {
                q: "Question 2: What is your biggest weakness and how are you improving it?",
                hint: "Name a real professional area of growth and your active steps to fix it.",
                answer: "Mention a real non-critical weakness (e.g. public speaking anxiety) and detail the concrete steps you are taking to overcome it."
            }
        ];

        function handleSend(e) {
            e.preventDefault();
            const input = document.getElementById('userInput');
            const msg = input.value.trim();
            if (!msg) return;

            // Render User Message
            addMessage(msg, 'user');
            input.value = '';

            // Show Typing
            document.getElementById('typing').classList.remove('hidden');
            scrollToBottom();

            // Simulate Bot Response
            setTimeout(() => {
                document.getElementById('typing').classList.add('hidden');
                generateBotResponse(msg);
                scrollToBottom();
            }, 500);
        }

        function quickSend(text) {
            document.getElementById('userInput').value = text;
            document.getElementById('chatForm').dispatchEvent(new Event('submit'));
        }

        function addMessage(text, sender) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = 'message-anim flex items-start gap-2.5 ' + (sender === 'user' ? 'justify-end' : '');

            if (sender === 'user') {
                div.innerHTML = `
                    <div class="bg-indigo-600 text-white rounded-2xl rounded-tr-none px-4 py-2.5 text-sm max-w-[85%] shadow-sm leading-relaxed">
                        ${escapeHtml(text)}
                    </div>
                `;
            } else {
                div.innerHTML = `
                    <div class="w-8 h-8 rounded-full bg-indigo-600 text-white flex items-center justify-center text-xs font-bold shrink-0">
                        AI
                    </div>
                    <div class="bg-white border border-slate-200 rounded-2xl rounded-tl-none p-3.5 text-sm shadow-sm max-w-[85%] space-y-2 text-slate-800 leading-relaxed">
                        ${formatText(text)}
                    </div>
                `;
            }

            container.appendChild(div);
            scrollToBottom();
        }

        function generateBotResponse(userMsg) {
            const text = userMsg.toLowerCase();

            // Mock Interview Flow
            if (inMockInterview) {
                const qList = interviewType === 'tech' ? techQuestions : hrQuestions;
                const currentQ = qList[interviewStep];
                
                let feedback = `<b>Feedback on your response:</b><br>Good attempt! Key points to cover: ${currentQ.answer}<br><br>`;
                interviewStep++;

                if (interviewStep < qList.length) {
                    const nextQ = qList[interviewStep];
                    addMessage(`${feedback}<b>Next Question (${interviewStep + 1}/${qList.length}):</b><br>${nextQ.q}`, 'bot');
                } else {
                    inMockInterview = false;
                    addMessage(`${feedback}<b>🎉 Mock Interview Completed!</b><br>Great practice session. You can start another mock interview anytime!`, 'bot');
                }
                return;
            }

            // Start Tech Mock Interview
            if (text.includes('tech mock') || text.includes('technical mock') || (text.includes('mock') && text.includes('tech'))) {
                inMockInterview = true;
                interviewStep = 0;
                interviewType = 'tech';
                addMessage(`🎯 <b>Technical Mock Interview Started!</b><br><br>${techQuestions[0].q}`, 'bot');
                return;
            }

            // Start HR Mock Interview
            if (text.includes('hr mock') || (text.includes('mock') && text.includes('hr'))) {
                inMockInterview = true;
                interviewStep = 0;
                interviewType = 'hr';
                addMessage(`👔 <b>HR Mock Interview Started!</b><br><br>${hrQuestions[0].q}`, 'bot');
                return;
            }

            // DSA
            if (text.includes('dsa') || text.includes('data structure') || text.includes('array') || text.includes('algorithm')) {
                addMessage(`💻 <b>DSA Practice: Reverse an Array</b><br><br><b>Problem:</b> Given an array of numbers, reverse it in-place.<br><br><b>Two-Pointer Approach (O(N) Time, O(1) Space):</b><br>1. Set pointer <code>left = 0</code> and <code>right = length - 1</code>.<br>2. Swap <code>arr[left]</code> and <code>arr[right]</code>.<br>3. Increment <code>left</code> and decrement <code>right</code> until they meet.`, 'bot');
                return;
            }

            // Aptitude
            if (text.includes('aptitude') || text.includes('math')) {
                addMessage(`📊 <b>Quantitative Aptitude Problem</b><br><br><b>Question:</b> A and B working together can complete a job in 6 days. A alone takes 10 days. How long will B take alone?<br><br><b>Solution:</b><br>• Combined 1-day work = 1/6<br>• A's 1-day work = 1/10<br>• B's 1-day work = 1/6 - 1/10 = (5-3)/30 = 2/30 = 1/15<br><br><b>Answer:</b> B will take <b>15 days</b> alone.`, 'bot');
                return;
            }

            // Resume
            if (text.includes('resume')) {
                addMessage(`📄 <b>Fresher Resume Checklist:</b><br><br>1. Keep it strictly <b>1 Page</b>.<br>2. Format project bullets using action verbs (e.g. <i>"Developed real-time chat app using WebSockets..."</i>).<br>3. Include sections: Education, Skills, Projects, Achievements.<br>4. Always add your GitHub & LinkedIn profiles at the top.`, 'bot');
                return;
            }

            // General Response
            addMessage(`I can help you with:<br>• <b>Technical & HR Mock Interviews</b> (Type "Tech Mock" or "HR Mock")<br>• <b>DSA & Core CS Concepts</b> (Type "DSA")<br>• <b>Aptitude Practice</b> (Type "Aptitude")<br>• <b>Resume Guidelines</b> (Type "Resume")<br><br>What would you like to focus on right now?`, 'bot');
        }

        function scrollToBottom() {
            const chat = document.getElementById('chatMessages');
            chat.scrollTop = chat.scrollHeight;
        }

        function clearChat() {
            inMockInterview = false;
            interviewStep = 0;
            document.getElementById('chatMessages').innerHTML = `
                <div class="message-anim flex items-start gap-2.5">
                    <div class="w-8 h-8 rounded-full bg-indigo-600 text-white flex items-center justify-center text-xs font-bold shrink-0">AI</div>
                    <div class="bg-white border border-slate-200 rounded-2xl rounded-tl-none p-3.5 text-sm shadow-sm max-w-[85%] space-y-2">
                        <p class="font-semibold text-indigo-950">Chat Reset! 👋</p>
                        <p class="text-slate-600">How can CareerPrep AI help you prepare today?</p>
                    </div>
                </div>
            `;
        }

        function formatText(str) {
            return str;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
